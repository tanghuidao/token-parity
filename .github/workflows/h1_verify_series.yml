name: h1-verify-series

on:
  workflow_dispatch:        # 一次性手动触发：核验 137 个待核实 seriesID 存在性

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Verify series IDs against BLS cu.series
        id: verify
        run: python h1_verify_series.py
        continue-on-error: true        # 有未通过项时仍要提交报告，不中断

      - name: Commit and push verification result
        if: always()
        run: |
          git config user.name "parity-bot"
          git config user.email "parity-bot@users.noreply.github.com"
          git add category_mapping.csv docs/h1_series_verification.md
          git commit -m "h1 series verify $(date -u +%F)" || echo "no changes to commit"
          git push

      - name: Flag verification gaps
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::存在未通过核验的 seriesID，详见 docs/h1_series_verification.md"
          exit 1
