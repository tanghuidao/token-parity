name: daily-parity-index

# 【纯 TEPI】主指数日更工作流。
# 注意：H1 CPI 世纪图表研究已于 2026-09-03 迁至 abundantics（丰裕学）仓库
#   research/h1-cpi/ 目录，本仓库不再包含任何 H1 相关内容。

on:
  schedule:
    # 高频日更 TEPI 主指数：UTC 00:10 = 北京时间 08:10，每天一次
    - cron: "10 0 * * *"
  workflow_dispatch:        # 允许在 Actions 页面手动触发（首次部署/验收时用）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Fetch data and compute index
        run: python parity_index.py --plot

      - name: Build static site
        run: python build_site.py

      - name: Commit and push
        run: |
          git config user.name "parity-bot"
          git config user.email "parity-bot@users.noreply.github.com"
          git add parity_series.csv basket_detail.csv parity_index.png docs/
          if [ -d raw ]; then git add raw/; fi
          git commit -m "daily update $(date -u +%F)" || echo "no changes to commit"
          git push
